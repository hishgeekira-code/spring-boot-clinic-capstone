<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Appointments - Clinic Appointment System</title>
    <!-- Нийтлэг суурь CSS болон Захиалгын тусгай CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/my-appointments.css}">
</head>
<body>
    <div class="container">
        <h2>My Appointments</h2>

        <!-- Шинэ Навигаци -->
        <nav class="main-navbar">
            <div class="nav-group">
                <a th:href="@{/doctors}" class="nav-item">Doctors</a>
                <a th:href="@{/my-appointments}" class="nav-item active">My Appointments</a>
            </div>

            <div class="nav-group">
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="nav-btn-logout">Logout</button>
                </form>
            </div>
        </nav>
        <hr/>

        <!-- Мэдэгдэл харуулах хэсэг -->
        <div th:if="${successMessage}" class="alert-message alert-success">
            <p th:text="${successMessage}"></p>
        </div>
        <div th:if="${errorMessage}" class="alert-message alert-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <!-- Хоосон үед харагдах хэсэг -->
        <div th:if="${#lists.isEmpty(appointments)}" class="empty-state">
            <p>You haven't booked any appointments yet.</p>
            <a th:href="@{/doctors}" class="btn btn-primary">Find a Doctor & Book Now</a>
        </div>

        <!-- Захиалгын жагсаалт хүснэгт -->
        <div class="table-responsive" th:if="${!#lists.isEmpty(appointments)}">
            <table class="appointments-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Doctor</th>
                        <th>Department</th>
                        <th>Date & Time</th>
                        <th>Reason</th>
                        <th style="width: 140px;">Status</th>
                        <th style="width: 100px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${appointments}">
                        <td th:text="${app.id}">1</td>
                        <td th:text="${'Dr. ' + app.doctor.firstName + ' ' + app.doctor.lastName}" style="font-weight: 500;">Dr. Sarah Jenkins</td>
                        <td th:text="${app.doctor.department != null ? app.doctor.department.name : 'N/A'}" style="color: #64748b;">Cardiology</td>
                        <td th:text="${app.schedule.availableDate + ' (' + app.schedule.startTime + ' - ' + app.schedule.endTime + ')'}">2026-09-25 (09:00 - 10:00)</td>
                        <td th:text="${app.reason != null and !#strings.isEmpty(app.reason) ? app.reason : '-'}" style="color: #64748b;">Routine Checkup</td>
                        <td>
                            <!-- Статусын өнгө болон утгуудыг зөв тааруулах хэсэг -->
                            <span th:if="${#strings.toString(app.status) == 'PENDING'}" 
                                  style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.82rem; font-weight: 600; background-color: #fef3c7; color: #b45309;">
                                PENDING
                            </span>
                            <span th:if="${#strings.toString(app.status) == 'CONFIRMED' or #strings.toString(app.status) == 'BOOKED'}" 
                                  style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.82rem; font-weight: 600; background-color: #e0e7ff; color: #4338ca;">
                                CONFIRMED
                            </span>
                            <span th:if="${#strings.toString(app.status) == 'COMPLETED'}" 
                                  style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.82rem; font-weight: 600; background-color: #dcfce7; color: #15803d;">
                                COMPLETED
                            </span>
                            <span th:if="${#strings.toString(app.status) == 'CANCELLED'}" 
                                  style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.82rem; font-weight: 600; background-color: #fee2e2; color: #b91c1c;">
                                CANCELLED
                            </span>
                        </td>
                        <td>
                            <!-- PENDING болон CONFIRMED (мөн хуучин BOOKED) үед Cancel хийх боломжтой -->
                            <form th:if="${#strings.toString(app.status) == 'PENDING' or #strings.toString(app.status) == 'CONFIRMED' or #strings.toString(app.status) == 'BOOKED'}" 
                                  th:action="@{/appointments/cancel/{id}(id=${app.id})}" 
                                  method="post" 
                                  style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to cancel this appointment?');">
                                <button type="submit" 
                                        style="background: none; border: none; color: #ef4444; font-weight: 500; cursor: pointer; text-decoration: underline; padding: 0;">
                                    Cancel
                                </button>
                            </form>
                            <!-- Дууссан эсвэл цуцлагдсан үед strikethrough/зураас гарна -->
                            <span th:unless="${#strings.toString(app.status) == 'PENDING' or #strings.toString(app.status) == 'CONFIRMED' or #strings.toString(app.status) == 'BOOKED'}" 
                                  style="color: #94a3b8;">
                                -
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
