<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Our Doctors - Clinic</title>
</head>
<body>
    <h2>Our Medical Specialists</h2>
    <hr/>

    <div th:if="${#lists.isEmpty(doctors)}">
        <p>No active doctors available at the moment.</p>
    </div>

    <table border="1" cellpadding="8" th:if="${!#lists.isEmpty(doctors)}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Specialization</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doc : ${doctors}" th:if="${doc.active}">
                <td th:text="${'Dr. ' + doc.firstName + ' ' + doc.lastName}">Dr. John Doe</td>
                <td th:text="${doc.specialization}">Cardiologist</td>
                <td th:text="${doc.department != null ? doc.department.name : 'N/A'}">Cardiology</td>
                <td>
                    <a th:href="@{/doctors/{id}(id=${doc.id})}">View Profile</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
