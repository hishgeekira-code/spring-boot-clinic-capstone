<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${'Dr. ' + doctor.firstName + ' ' + doctor.lastName}">Doctor Profile</title>
</head>
<body>
    <a th:href="@{/doctors}">← Back to Doctors List</a>
    <hr/>

    <h2 th:text="${'Dr. ' + doctor.firstName + ' ' + doctor.lastName}">Dr. John Doe</h2>
    <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}">Cardiologist</span></p>
    <p><strong>Department:</strong> <span th:text="${doctor.department != null ? doctor.department.name : 'N/A'}">Cardiology</span></p>
    <p><strong>Bio:</strong></p>
    <p th:text="${doctor.bio}">Doctor biography goes here...</p>

    <hr/>
    <h3>Available Schedules</h3>
    <div th:if="${#lists.isEmpty(schedules)}">
        <p>No available schedules for this doctor at the moment.</p>
    </div>

    <table border="1" cellpadding="8" th:if="${!#lists.isEmpty(schedules)}">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time Slot</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sch : ${schedules}" th:if="${sch.available}">
                <td th:text="${sch.availableDate}">2026-09-20</td>
                <td th:text="${sch.startTime + ' - ' + sch.endTime}">09:00 - 10:00</td>
                <td>
                    <a th:href="@{/appointments/book/{scheduleId}(scheduleId=${sch.id})}">Book Appointment</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
