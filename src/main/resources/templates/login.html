<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Clinic Appointment System</title>
</head>
<body>
    <h2>Login</h2>
    <div th:if="${param.error}" style="color:red;">Invalid email or password.</div>
    <div th:if="${param.logout}" style="color:green;">You have been logged out.</div>
    <div th:if="${param.success}" style="color:green;">Registration successful! Please login.</div>

    <form th:action="@{/login}" method="post">
        <div>
            <label>Email:</label>
            <input type="email" name="username" required />
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
</body>
</html>
