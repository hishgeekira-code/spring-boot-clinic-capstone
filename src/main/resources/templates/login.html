<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Clinic Appointment System</title>
    <!-- Нийтлэг суурь CSS болон Нэвтрэх тусгай CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <a th:href="@{/doctors}" class="back-link">← Back to Doctors List</a>
            
            <h2>Login</h2>
            
            <!-- Spring Security alerts -->
            <div th:if="${param.error}" class="alert-message alert-error">
                Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert-message alert-success">
                You have been logged out.
            </div>
            <div th:if="${param.success}" class="alert-message alert-success">
                Registration successful! Please login.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="username" required placeholder="name@example.com" autofocus />
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password" />
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">Login</button>
            </form>

            <div class="login-footer">
                Don't have an account? <a th:href="@{/register}">Register here</a>
            </div>
        </div>
    </div>
</body>
</html>
