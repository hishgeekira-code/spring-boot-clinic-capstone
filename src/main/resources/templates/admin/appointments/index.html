<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Appointment Management</title>
</head>
<body>
    <h2>Admin - Appointment Dashboard</h2>
    <p>
        <a th:href="@{/admin}">← Back to Admin Home</a> | 
        <a th:href="@{/admin/doctors}">Manage Doctors</a> | 
        <a th:href="@{/admin/schedules}">Manage Schedules</a> | 
        <a th:href="@{/logout}">Logout</a>
    </p>
    <hr/>

    <div th:if="${successMessage}" style="color: green; font-weight: bold;">
        <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" style="color: red; font-weight: bold;">
        <p th:text="${errorMessage}"></p>
    </div>

    <div th:if="${#lists.isEmpty(appointments)}">
        <p>No appointments found in the system.</p>
    </div>

    <table border="1" cellpadding="8" th:if="${!#lists.isEmpty(appointments)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Date & Time</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Change Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="app : ${appointments}">
                <td th:text="${app.id}">1</td>
                <td th:text="${app.patient.firstName + ' ' + app.patient.lastName}">John Patient</td>
                <td th:text="${'Dr. ' + app.doctor.firstName + ' ' + app.doctor.lastName}">Dr. Sarah Jenkins</td>
                <td th:text="${app.schedule.availableDate + ' (' + app.schedule.startTime + ' - ' + app.schedule.endTime + ')'}">2026-09-18 (9:00 AM - 10:00 AM)</td>
                <td th:text="${app.reason != null ? app.reason : '-'}">testing</td>
                <td>
                    <strong th:text="${app.status}">BOOKED</strong>
                </td>
                <td>
                    <form th:action="@{/admin/appointments/{id}/status(id=${app.id})}" method="post" style="display:inline;">
                        <select name="status" onchange="this.form.submit()">
                            <option th:each="st : ${statuses}" 
                                    th:value="${st}" 
                                    th:text="${st}" 
                                    th:selected="${st == app.status}">
                            </option>
                        </select>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
