<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - Clinic Appointment System</title>
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background-color: #f9f9f9;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #555;
            font-size: 16px;
        }
        .stat-card .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <h2>Admin Dashboard</h2>
    <p>
        <a th:href="@{/admin/departments}">Manage Departments</a> | 
        <a th:href="@{/admin/doctors}">Manage Doctors</a> | 
        <a th:href="@{/admin/schedules}">Manage Schedules</a> | 
        <a th:href="@{/admin/appointments}">Manage Appointments</a> | 
        <a th:href="@{/logout}">Logout</a>
    </p>
    <hr/>

    <!-- Баримтын 14 дэх Statistics хэсэг -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Doctors</h3>
            <div class="stat-number" th:text="${stats.totalDoctors}">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Patients</h3>
            <div class="stat-number" th:text="${stats.totalPatients}">0</div>
        </div>
        <div class="stat-card">
            <h3>Today's Appointments</h3>
            <div class="stat-number" th:text="${stats.todayAppointments}">0</div>
        </div>
        <div class="stat-card">
            <h3>Booked Appointments</h3>
            <div class="stat-number" th:text="${stats.bookedAppointments}">0</div>
        </div>
        <div class="stat-card">
            <h3>Completed Appointments</h3>
            <div class="stat-number" th:text="${stats.completedAppointments}">0</div>
        </div>
        <div class="stat-card">
            <h3>Cancelled Appointments</h3>
            <div class="stat-number" th:text="${stats.cancelledAppointments}">0</div>
        </div>
    </div>
</body>
</html>
