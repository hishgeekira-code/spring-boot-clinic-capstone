<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Manage Doctors - Admin</title>
<!-- Нийтлэг суурь CSS болон Эмчийн хуудасны тусгай CSS -->
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/doctor-management.css}">
</head>
<body>
	<div class="container">
		<h2>Doctor Management</h2>

		<!-- Загварлаг Навигацийн мөр -->
		<nav class="main-navbar">
			<div class="nav-group">
				<!-- Навигацийн хэсэгт: -->
				<a th:href="@{/}" class="nav-item">Home</a> <a
					th:href="@{/admin/dashboard}" class="nav-item">Dashboard</a> <a
					th:href="@{/admin/departments}" class="nav-item">Departments</a> <a
					th:href="@{/admin/doctors}" class="nav-item active">Doctors</a> <a
					th:href="@{/admin/schedules}" class="nav-item">Schedules</a> <a
					th:href="@{/admin/appointments}" class="nav-item">Appointments</a>
			</div>

			<div class="nav-group">
				<form th:action="@{/logout}" method="post" style="margin: 0;">
					<button type="submit" class="nav-btn-logout">Logout</button>
				</form>
			</div>
		</nav>
		<hr />

		<!-- Add / Edit Doctor Form -->
		<div class="doctor-form-card">
			<h3
				th:text="${doctor.id != null ? 'Edit Doctor (ID: ' + doctor.id + ')' : 'Add New Doctor'}">Add
				/ Edit Doctor</h3>

			<form th:action="@{/admin/doctors/save}" th:object="${doctor}"
				method="post">
				<input type="hidden" th:field="*{id}" />

				<div class="form-grid">
					<div class="form-group">
						<label>First Name:</label> <input type="text"
							th:field="*{firstName}" required placeholder="First name" />
					</div>

					<div class="form-group">
						<label>Last Name:</label> <input type="text"
							th:field="*{lastName}" required placeholder="Last name" />
					</div>

					<div class="form-group">
						<label>Specialization:</label> <input type="text"
							th:field="*{specialization}" required
							placeholder="e.g. Cardiologist" />
					</div>

					<div class="form-group">
						<label>Department:</label> <select name="department" required>
							<option value="">-- Select Department --</option>
							<option th:each="dept : ${departments}" th:value="${dept.id}"
								th:text="${dept.name}"
								th:selected="${doctor.department != null and doctor.department.id == dept.id}">
							</option>
						</select>
					</div>

					<div class="form-group full-width">
						<label>Bio:</label>
						<textarea th:field="*{bio}" rows="3"
							placeholder="Doctor biography, experience, certifications..."></textarea>
					</div>

					<div class="form-group full-width">
						<div class="checkbox-group">
							<input type="checkbox" id="activeCheckbox" th:field="*{active}" />
							<label for="activeCheckbox">Active Status</label> <small>(Check
								if active for public bookings)</small>
						</div>
					</div>
				</div>

				<div class="form-actions">
					<button type="submit" class="btn btn-primary"
						th:text="${doctor.id != null ? 'Update Doctor' : 'Save Doctor'}">Save
						Doctor</button>
					<a th:if="${doctor.id != null}" th:href="@{/admin/doctors}"
						class="btn btn-secondary">Cancel Edit</a>
				</div>
			</form>
		</div>

		<!-- Doctor List -->
		<h3>Doctor List</h3>
		<div class="table-responsive">
			<table class="doctor-table">
				<thead>
					<tr>
						<th style="width: 70px;">ID</th>
						<th>Name</th>
						<th>Specialization</th>
						<th>Department</th>
						<th style="width: 100px;">Active</th>
						<th style="width: 140px;">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(doctors)}">
						<td colspan="6"
							style="text-align: center; color: #64748b; padding: 25px;">No
							doctors found.</td>
					</tr>
					<tr th:each="doc : ${doctors}">
						<td th:text="${doc.id}">1</td>
						<td th:text="${doc.firstName + ' ' + doc.lastName}"
							style="font-weight: 500;">John Doe</td>
						<td th:text="${doc.specialization}">Cardiologist</td>
						<td
							th:text="${doc.department != null ? doc.department.name : 'N/A'}"
							style="color: #64748b;">Cardiology</td>
						<td><span
							th:class="${doc.active ? 'badge-status status-active' : 'badge-status status-inactive'}"
							th:text="${doc.active ? 'Yes' : 'No'}">Yes</span></td>
						<td><a th:href="@{/admin/doctors/edit/{id}(id=${doc.id})}"
							class="btn-edit">Edit</a> <span class="divider"
							style="margin: 0 4px;">|</span> <a
							th:href="@{/admin/doctors/delete/{id}(id=${doc.id})}"
							class="btn-delete"
							onclick="return confirm('Are you sure you want to delete this doctor?')">Delete</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
