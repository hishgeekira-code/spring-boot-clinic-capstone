<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Departments - Admin</title>
</head>
<body>
    <h2>Department Management</h2>
    <a th:href="@{/admin}">Back to Admin Dashboard</a>
    <hr/>

    <h3>Add / Edit Department</h3>
    <form th:action="@{/admin/departments/save}" th:object="${department}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div>
            <label>Name:</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <div>
            <label>Description:</label>
            <input type="text" th:field="*{description}" />
        </div>
        <button type="submit">Save Department</button>
    </form>

    <hr/>

    <h3>Department List</h3>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="dept : ${departments}">
                <td th:text="${dept.id}">1</td>
                <td th:text="${dept.name}">Cardiology</td>
                <td th:text="${dept.description}">Heart care</td>
                <td>
                    <a th:href="@{/admin/departments/edit/{id}(id=${dept.id})}">Edit</a> | 
                    <a th:href="@{/admin/departments/delete/{id}(id=${dept.id})}" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
