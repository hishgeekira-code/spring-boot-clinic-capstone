<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Clinic Appointment System</title>
    <!-- Нийтлэг суурь CSS болон Бүртгэлийн тусгай CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <a th:href="@{/doctors}" class="back-link">← Back to Doctors List</a>
            
            <h2>Register Customer Account</h2>

            <!-- Серверээс ирэх ерөнхий алдаа -->
            <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}">
                An error occurred during registration.
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="firstName">First Name: <span class="required">*</span></label>
                    <input type="text" id="firstName" th:field="*{firstName}" required placeholder="First name" autofocus />
                    <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name: <span class="required">*</span></label>
                    <input type="text" id="lastName" th:field="*{lastName}" required placeholder="Last name" />
                    <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email: <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}" required placeholder="name@example.com" />
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password: <span class="required">*</span></label>
                    <input type="password" id="password" th:field="*{password}" required placeholder="Enter password" />
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="e.g. 99112233" />
                </div>

                <button type="submit" class="btn btn-primary btn-register">Register</button>
            </form>

            <div class="register-footer">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
